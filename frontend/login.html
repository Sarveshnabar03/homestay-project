<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Homestay</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --accent:#2563eb; --border:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Inter,Segoe UI,Arial,sans-serif; background:linear-gradient(120deg,#dbeafe,#f8fafc); color:var(--text); }
    .card { width:min(420px,92vw); background:var(--card); border:1px solid var(--border); border-radius:18px; padding:28px; box-shadow:0 20px 50px rgba(15,23,42,.08); }
    h1 { margin:0 0 6px; font-size:1.6rem; }
    p { margin:0 0 20px; color:var(--muted); }
    input, button { width:100%; border-radius:12px; border:1px solid var(--border); padding:12px; font-size:1rem; }
    input { margin-bottom:12px; }
    button { border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    .hint { margin-top:14px; color:var(--muted); font-size:.92rem; }
    a { color:var(--accent); text-decoration:none; }
    .msg { margin-top:10px; color:#b91c1c; min-height:1.2em; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome Back</h1>
    <p>Login to book stays and track your trips.</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="msg" class="msg"></div>
    <div class="hint">New user? <a href="register.html">Create account</a></div>
  </div>

  <script>
    async function login() {
      const msg = document.getElementById("msg");
      msg.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        msg.textContent = "Please enter email and password.";
        return;
      }

      try {
        const res = await fetch("http://localhost:5000/api/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ email, password })
        });

        const raw = await res.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (_) { data = { message: raw }; }

        if (data.token) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("role", data.role || "user");
          window.location = data.role === "admin" ? "admin.html" : "home.html";
          return;
        }
        msg.textContent = data.message || "Login failed.";
      } catch (err) {
        msg.textContent = "Cannot connect to server.";
      }
    }
  </script>
</body>
</html>
